name: vetosanya
description: فيتو ثانية - خدمات تنقل وتوصيل داخل مدينتك.
publish_to: none
version: 3.0.0+33

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  cupertino_icons: 2.0.0

  supabase_flutter: ^2.9.1
  sizer: ^2.0.15
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  web: ^1.1.1
  url_launcher: ^6.3.2

  cached_network_image: ^3.3.1
  connectivity_plus: ^6.1.4
  dio: ^5.4.0
  fluttertoast: ^8.2.4
  fl_chart: ^0.65.0
  go_router: ^14.6.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^13.0.1

  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.0

  universal_html: ^2.2.4
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  flutter_local_notifications: ^20.1.0
  flutter_background_service: 5.1.0
  showcaseview: 5.0.2
  smooth_page_indicator: ^3.0.0
  onesignal_flutter: ^5.7.0
  qr_flutter: 4.1.0
  pdf: 3.12.0
  printing: 5.14.3
  phone_numbers_parser: 9.0.28
  country_picker: 2.0.28
  maplibre_gl: 0.27.1
  image: 4.8.0
  flutter_secure_storage: 11.2.0

dev_dependencies:
  http: 1.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/veto_sanya_app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#F7F8FC"
  adaptive_icon_foreground: "assets/images/veto_sanya_app_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/onboarding/
    - assets/
    - assets/images/
    - assets/sounds/
    - assets/vehicles/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
